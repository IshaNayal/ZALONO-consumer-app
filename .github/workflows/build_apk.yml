name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '17'
          cache: 'gradle'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Ensure Android platform scaffolding
        run: |
          cd flutter_zalono
          if [ ! -d "android" ]; then
            echo "Android project directory not found, scaffolding with flutter create..."
            flutter create . --platforms=android --org com.zalono.app --project-name zalono
          fi

      - name: Get Flutter dependencies
        run: |
          cd flutter_zalono
          flutter pub get

      - name: Build Android APK (Release & Debug)
        run: |
          cd flutter_zalono
          flutter build apk --release --no-tree-shake-icons
          flutter build apk --debug

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: zalono-release-apk
          path: flutter_zalono/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Debug APK (Universal Installable)
        uses: actions/upload-artifact@v4
        with:
          name: zalono-debug-apk
          path: flutter_zalono/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14
