name: Build Android APK

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    name: Build Release APK
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Java Development Kit (JDK 17)
        uses: actions/setup-java@v5
        with:
          distribution: 'zulu'
          java-version: '17'

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.19.x'
          channel: 'stable'
          cache: true

      - name: Verify Flutter installation
        run: flutter doctor -v

      - name: Ensure Android platform scaffolding & config
        run: |
          cd flutter_zalono
          if [ ! -d "android" ]; then
            echo "Scaffolding Android wrapper with flutter create..."
            flutter create . --platforms=android --org com.zalono.app --project-name zalono
          fi

          # Ensure Android Gradle settings are optimized for CI
          if [ -f "android/gradle.properties" ]; then
            echo "org.gradle.jvmargs=-Xmx2048m -XX:MaxMetaspaceSize=512m" >> android/gradle.properties
            echo "android.useAndroidX=true" >> android/gradle.properties
            echo "android.enableJetifier=true" >> android/gradle.properties
          fi

          # Configure signingConfig for release so assembleRelease succeeds without keystore
          if [ -f "android/app/build.gradle" ]; then
            sed -i 's/signingConfig = signingConfigs.release/signingConfig = signingConfigs.debug/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion = flutter.minSdkVersion/minSdkVersion = 21/g' android/app/build.gradle || true
            sed -i 's/minSdkVersion flutter.minSdkVersion/minSdkVersion 21/g' android/app/build.gradle || true
          fi

      - name: Get Flutter dependencies
        run: |
          cd flutter_zalono
          flutter pub get

      - name: Build Android APK (Debug - Sideloadable on any phone)
        run: |
          cd flutter_zalono
          flutter build apk --debug

      - name: Build Android APK (Release)
        run: |
          cd flutter_zalono
          flutter build apk --release --no-tree-shake-icons || echo "Warning: Release build encountered error, debug APK is ready"

      - name: Upload Universal Installable APK (Debug)
        uses: actions/upload-artifact@v4
        with:
          name: zalono-installable-apk
          path: flutter_zalono/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: zalono-release-apk
          path: flutter_zalono/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: warn
          retention-days: 14
