# Render blueprint for Zalono.
#
# The site is the Flutter app compiled to web; the Node server hosts both the
# Flutter build (at /) and the JSON API (at /api).
#
# After changing this file, either create a new Blueprint service from the
# repository, or apply the same values in the Render dashboard and redeploy.
services:
  - type: web
    name: zalono
    runtime: node
    plan: free
    # The Flutter SDK is not on this image, so scripts/build-flutter-web.mjs
    # downloads it before building. That keeps the build working no matter how
    # this command is invoked or what PATH the build environment exports.
    buildCommand: npm install && npm run build
    startCommand: npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_VERSION
        value: "22"